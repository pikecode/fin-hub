[project]
name = "fin-hub-api"
version = "0.1.0"
description = "Fin Hub API service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "celery>=5.5",
  "cryptography>=45.0",
  "fastapi>=0.116",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.20",
  "redis>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
  "pytest-asyncio>=0.24",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "performance: performance benchmark tests",
]
