server {
    listen 80;
    server_name moshuo.fun www.moshuo.fun;
    root /usr/share/nginx/html/moshuo;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/moshuo.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moshuo.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_name moshuo.fun;
    root /usr/share/nginx/html/moshuo;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/moshuo.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moshuo.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_name fin.moshuo.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/moshuo;
        try_files $uri =404;
    }

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
    }

    location /_next/static/ {
        proxy_pass http://admin-web:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://admin-web:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}

